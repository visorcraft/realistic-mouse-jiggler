[package]
name = "realistic-mouse-jiggler"
version = "0.5.0"
edition = "2021"
rust-version = "1.95"
authors = ["VisorCraft LLC <packages@visorcraft.com>"]
description = "Cross-platform desktop mouse jiggler with realistic motion, tray controls, and global bindings."
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = { version = "0.37.0", features = ["glow"] }
enigo = { version = "0.6.1", features = ["wayland"] }
fastrand = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
x11rb = "0.14.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }
